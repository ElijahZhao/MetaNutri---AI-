name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads the repository. No job needs to write
# to the repo, so scope the default GITHUB_TOKEN down accordingly.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  backend:
    name: Backend (syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all Python sources
        run: python -m compileall -q app

      - name: Verify application imports
        env:
          # Local default is fine for an import smoke test; production sets its own.
          SECRET_KEY: ci-smoke-test-key
        run: python -c "from app.main import app; print('FastAPI app OK:', app.title)"

  research:
    name: Research (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # numpy 2.5 / pandas 3 pin Python >=3.12 (see research/requirements.txt).
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            research/app/requirements.txt
            research/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src app

      # Streamlit AppTest (app/test_app.py) + inference unit tests
      # (app/tests/). The 90% coverage gate is set in pyproject.toml; this
      # needs no training stack, no dataset and no network.
      - name: Tests (pytest + coverage)
        run: pytest --cov --cov-report=term-missing
