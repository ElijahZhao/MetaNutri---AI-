name: Production Health Check

# What this does: smoke-test production. On every push to main it GETs the
# backend's /health and the frontend's /health proxy; you can also run the same
# checks on demand from the Actions tab. It does NOT keep the backend alive —
# that is handled outside GitHub by a cron-job.org job.
#
# Why the keep-alive moved out: Render's free tier spins a service down after
# ~15 minutes without external traffic, so the next visitor pays a 30-60s cold
# start. A cron-job.org job pings /health every 10 minutes, holding one instance
# up 24/7 (~730 instance-hours a month, inside Render's 750 free hours). That
# replaces the old `on: schedule` here, which never fired — GitHub delivered
# zero `schedule` events in this repository, and moving the cron off the hour
# did not change that. The frontend prewarm + cold-start UX (see
# frontend/src/lib/backendWarmup.ts) still covers any gap.
#
# Caveat: this runs as soon as the push lands, which can be before Render
# finishes deploying, so read it as an availability smoke test, not as proof
# that the new version deployed successfully.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this job only issues outbound curl requests; it never reads
# or writes the repository, so the default GITHUB_TOKEN can be fully scoped down.
permissions:
  contents: read

# Only one production check needs to be in flight at a time.
concurrency:
  group: production-health-check
  cancel-in-progress: false

jobs:
  ping:
    name: Production health check (backend + frontend)
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://metanutri-backend.onrender.com
      FRONTEND_URL: https://meta-nutri-ai.vercel.app
    steps:
      - name: Wake backend
        run: |
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 120 "$BACKEND_URL/health"

      # Also exercises the frontend's /health rewrite (see frontend/next.config.ts),
      # so the prewarm probe path is verified end to end, not just assumed.
      - name: Verify frontend /health proxy
        run: |
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --max-time 120 "$FRONTEND_URL/health")
          echo "GET $FRONTEND_URL/health -> HTTP $code"
          cat /tmp/health.json; echo
          [ "$code" = "200" ] || exit 1
