name: Backend Keep-alive

# Render's free tier spins a service down after ~15 minutes without traffic, so
# the next visitor pays a 30-60s cold start. This cron pings /health every 10
# minutes to keep the instance warm.
#
# Budget note: 24/7 keeping a single instance alive costs ~730 instance-hours a
# month, which fits inside Render's 750 free hours. Because GitHub's scheduled
# runs can be delayed under load, this is best-effort — the frontend prewarm +
# cold-start UX (see frontend/src/lib/backendWarmup.ts) covers the gaps.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Only one keep-alive ping needs to be in flight at a time.
concurrency:
  group: backend-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Keep-alive ping + health checks
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://metanutri-backend.onrender.com
      FRONTEND_URL: https://meta-nutri-ai.vercel.app
    steps:
      - name: Wake backend
        run: |
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 120 "$BACKEND_URL/health"

      # Also exercises the frontend's /health rewrite (see frontend/next.config.ts),
      # so the prewarm probe path is verified end to end, not just assumed.
      - name: Verify frontend /health proxy
        run: |
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --max-time 120 "$FRONTEND_URL/health")
          echo "GET $FRONTEND_URL/health -> HTTP $code"
          cat /tmp/health.json; echo
          [ "$code" = "200" ] || exit 1
