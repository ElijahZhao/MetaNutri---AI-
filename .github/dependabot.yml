# Dependabot version updates.
#
# Policy: the model runtime is frozen. The demo and research pipelines are
# pinned to the exact versions used for the reproducible runs behind the
# preprint, so version-update PRs are disabled for those packages. Bumping
# them can silently change predictions and experiment numbers; upgrades are
# manual, deliberate, and followed by a full re-run plus CSV diff.
#
# Development tooling (ruff, pytest) may still update, as it cannot change
# results. The deployed backend and frontend are fully frozen: upgrading them
# requires a staged migration (Tailwind 4, TypeScript 7, ESLint 10,
# numpy 2.x / pandas 3.x, bcrypt 5.x) plus production smoke tests.
#
# Security advisories are still raised individually and immediately; the
# `ignore` rules below only affect scheduled version updates.
version: 2
updates:
  # Platform backend (FastAPI)
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python-backend:
        patterns: ["*"]
    ignore:
      # Deployed service: pinned for reproducibility of the live demo.
      # Manual upgrades only, verified against the full CI + smoke tests.
      - dependency-name: "*"

  # Research pipeline. Runtime stack is frozen; only dev tooling may move.
  - package-ecosystem: pip
    directory: /research
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python-research:
        patterns: ["*"]
    ignore:
      - dependency-name: "numpy"
      - dependency-name: "pandas"
      - dependency-name: "scikit-learn"
      - dependency-name: "xgboost"
      - dependency-name: "scipy"
      - dependency-name: "matplotlib"
      - dependency-name: "statsmodels"
      - dependency-name: "requests"
      - dependency-name: "markdown"
      - dependency-name: "weasyprint"
      # /research scans nested manifests, including research/app/requirements.txt
      - dependency-name: "streamlit"

  # Streamlit demo (frozen model runtime). No version updates at all: every
  # package here feeds inference, and CI cannot detect output drift.
  - package-ecosystem: pip
    directory: /research/app
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python-demo:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"

  # Platform frontend (Next.js). Majors require staged migrations
  # (Tailwind 4 PostCSS plugin, TypeScript 7 unsupported by typescript-eslint).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-frontend:
        patterns: ["*"]
    ignore:
      # Deployed frontend: frozen until the staged Tailwind 4 / TypeScript 7 /
      # ESLint 10 migration is done deliberately.
      - dependency-name: "*"

  # GitHub Actions used by the workflows in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
